name: persona-image-lab
services:
  lab:
    build: .
    image: persona-image-lab:local
    platform: linux/arm64
    gpus: all
    ipc: host
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${PERSONA_HTTP_PORT:-7862}:7860"
    volumes:
      - ./model:/workspace/model
      - ./outputs:/workspace/outputs
      - ./cache:/workspace/cache
      - "${PERSONA_DATA_DIR:-./data/personas}:/persona-data:ro"
    environment:
      PERSONA_HOST: 0.0.0.0
      PERSONA_PORT: "7860"
      PERSONA_DIR: /persona-data
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PERSONA_PROMPT_ENHANCER: "${PERSONA_PROMPT_ENHANCER:-1}"
      PERSONA_PE_BACKEND: "${PERSONA_PE_BACKEND:-auto}"
      PERSONA_TORCH_COMPILE: "${PERSONA_TORCH_COMPILE:-1}"
      PERSONA_FP8: "${PERSONA_FP8:-off}"
      PERSONA_DEFAULT_STEPS: "${PERSONA_DEFAULT_STEPS:-20}"
      TORCHINDUCTOR_CACHE_DIR: /workspace/cache/torchinductor
      PERSONA_PE_T2I_SOCKET: /workspace/cache/prompt-enhancer/t2i.sock
      PERSONA_PE_I2I_SOCKET: /workspace/cache/prompt-enhancer/i2i.sock
      PERSONA_THEME: "${PERSONA_THEME:-ocean}"
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 6m
      retries: 3
