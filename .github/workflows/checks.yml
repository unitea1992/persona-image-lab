name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: CPU unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n persona
      - name: Python syntax
        run: python -m compileall -q lab.py history.py settings.py manage.py persona_profiles.py benchmark_batches.py scripts/check_branding.py
      - name: Upstream branding boundary
        run: python scripts/check_branding.py
      - name: Public commit identity
        run: python scripts/check_commit_identity.py
      - name: Compose configuration
        run: docker compose config --quiet
