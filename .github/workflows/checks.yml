name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: CPU unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n persona scripts/prompt-enhancers.sh
      - name: Python syntax
        run: python -m compileall -q lab.py history.py settings.py manage.py persona_profiles.py prompt_enhancer.py benchmark_batches.py scripts/check_branding.py
      - name: Upstream branding boundary
        run: python scripts/check_branding.py
      - name: Compose configuration
        run: docker compose config --quiet
